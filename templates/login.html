<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari AI - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #0b1a30;        /* Azul muy oscuro del fondo general */
            --card-bg: #ffffff;           /* Fondo BLANCO para el cuadro central */
            --btn-color: #00c4cc;         /* Azul aguamarina para el botón */
            --btn-hover: #009ea3;         /* Azul aguamarina más oscuro para el hover */
            --text-main: #333333;         /* Texto oscuro para que resalte en el blanco */
            --text-muted: #6c757d;        /* Gris medio para etiquetas */
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg); /* El fondo general se mantiene oscuro */
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Este es el cuadro blanco que encierra TODO */
        .login-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        /* Ajustamos el formulario para que ocupe todo el ancho de la tarjeta blanca */
        form {
            width: 100%;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            background-color: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--btn-color);
            box-shadow: 0 0 0 3px rgba(0, 196, 204, 0.2);
            outline: none;
        }

        .btn-cari {
            background-color: var(--btn-color);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            transition: background-color 0.2s ease;
            margin-top: 20px;
        }

        .btn-cari:hover {
            background-color: var(--btn-hover);
            color: #ffffff;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            width: 100%;
        }
    </style>
</head>
<body>

<div class="login-wrapper p-3">
    
    <div class="login-card">
        
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logo_cari.png') }}" alt="Cari AI Logo">
        </div>

        <form action="/" method="POST">
            <div class="mb-3">
                <label for="usuario" class="form-label">Login</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required autocomplete="off">
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-cari">Ingresar</button>
        </form>

        <div class="footer-text">
            © 2026 Apex America - Emulador de Gestión Operativa
        </div>

    </div>

</div>

</body>
</html>
